<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#2B1810"/>

  <!-- Coffee Cup -->
  <g transform="translate(30, 40)">
    <!-- Cup Body -->
    <path d="M10 25 h100 v60 c0 12 -10 22 -22 22 h-56 c-12 0 -22 -10 -22 -22 v-60 z" fill="#C08552"/>

    <!-- Cup Rim -->
    <rect x="10" y="25" width="100" height="12" rx="6" fill="#FBF5EA"/>

    <!-- Coffee Surface -->
    <ellipse cx="60" cy="31" rx="50" ry="6" fill="#4A2E1F"/>

    <!-- Handle -->
    <path d="M110 40 h12 c10 0 18 8 18 18 v8 c0 10 -8 18 -18 18 h-12"
          stroke="#FBF5EA"
          stroke-width="8"
          fill="none"
          stroke-linecap="round"/>

    <!-- Steam -->
    <g opacity="0.6">
      <path d="M40 12 Q35 2 40 -5" stroke="#FBF5EA" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M60 10 Q55 0 60 -7" stroke="#FBF5EA" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M80 12 Q75 2 80 -5" stroke="#FBF5EA" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>