<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#2B1810"/>

  <!-- Coffee Cup -->
  <g transform="translate(12, 16)">
    <!-- Cup Body -->
    <path d="M4 8 h32 v20 c0 4 -3 7 -7 7 h-18 c-4 0 -7 -3 -7 -7 v-20 z" fill="#C08552"/>

    <!-- Cup Rim -->
    <rect x="4" y="8" width="32" height="4" rx="2" fill="#FBF5EA"/>

    <!-- Coffee Surface -->
    <ellipse cx="20" cy="10" rx="16" ry="2" fill="#4A2E1F"/>

    <!-- Handle -->
    <path d="M36 14 h4 c3 0 5 2 5 5 v2 c0 3 -2 5 -5 5 h-4"
          stroke="#FBF5EA"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <!-- Steam -->
    <g opacity="0.6">
      <path d="M14 4 Q12 0 14 -2" stroke="#FBF5EA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M20 3 Q18 -1 20 -3" stroke="#FBF5EA" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M26 4 Q24 0 26 -2" stroke="#FBF5EA" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>