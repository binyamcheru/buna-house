<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Gradient Background (like hero section) -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C08552;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FBF5EA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FBF5EA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Gradient -->
  <rect width="1200" height="630" fill="url(#heroGrad)"/>

  <!-- Glow Effect -->
  <ellipse cx="900" cy="315" rx="400" ry="400" fill="url(#glow)"/>

  <!-- Coffee Cup Art (Right Side) -->
  <g transform="translate(750, 100)">
    <!-- Large Coffee Cup -->
    <g opacity="0.9">
      <!-- Cup Body -->
      <path d="M50 120 h300 v280 c0 30 -25 55 -55 55 h-190 c-30 0 -55 -25 -55 -55 v-280 z"
            fill="#2B1810" opacity="0.8"/>
      <path d="M60 130 h280 v260 c0 25 -20 45 -45 45 h-190 c-25 0 -45 -20 -45 -45 v-260 z"
            fill="#4A2E1F"/>

      <!-- Cup Rim -->
      <rect x="50" y="110" width="300" height="20" rx="10" fill="#FBF5EA" opacity="0.9"/>

      <!-- Coffee Surface with foam -->
      <ellipse cx="200" cy="120" rx="150" ry="12" fill="#6B5548"/>
      <ellipse cx="200" cy="118" rx="140" ry="10" fill="#8B7355" opacity="0.6"/>

      <!-- Handle -->
      <path d="M350 180 h30 c25 0 45 20 45 45 v40 c0 25 -20 45 -45 45 h-30"
            stroke="#FBF5EA"
            stroke-width="18"
            fill="none"
            stroke-linecap="round"
            opacity="0.8"/>

      <!-- Latte Art -->
      <g transform="translate(200, 120)">
        <path d="M0 -30 Q-20 -10 -30 10 Q-20 30 0 40 Q20 30 30 10 Q20 -10 0 -30 z"
              fill="#FBF5EA" opacity="0.7"/>
        <circle cx="0" cy="5" r="15" fill="#FBF5EA" opacity="0.5"/>
      </g>

      <!-- Steam -->
      <g opacity="0.4">
        <path d="M120 80 Q100 40 120 0"
              stroke="#FBF5EA" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M200 70 Q180 30 200 -10"
              stroke="#FBF5EA" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M280 80 Q260 40 280 0"
              stroke="#FBF5EA" stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(80, 150)">
    <!-- Badge Label -->
    <text x="0" y="0"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="32"
          font-weight="600"
          fill="#FBF5EA"
          opacity="0.9">
      ✦ PREMIUM COFFEE
    </text>

    <!-- Main Heading -->
    <text x="0" y="90"
          font-family="Georgia, serif"
          font-size="82"
          font-weight="700"
          fill="#FBF5EA"
          letter-spacing="-1">
      <tspan x="0" dy="0">Buna House</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="180"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="36"
          font-weight="400"
          fill="#FBF5EA"
          opacity="0.95">
      <tspan x="0" dy="0">Crafting moments,</tspan>
      <tspan x="0" dy="48">one cup at a time.</tspan>
    </text>

    <!-- Feature Points -->
    <g transform="translate(0, 280)">
      <text font-family="system-ui, -apple-system, sans-serif"
            font-size="24"
            font-weight="500"
            fill="#FBF5EA"
            opacity="0.9">
        <tspan x="0" y="0">✦ Bole, Addis Ababa</tspan>
        <tspan x="0" y="40">✦ 30-45 min delivery</tspan>
        <tspan x="0" y="80">✦ Rated 4.9★ by 2000+</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="80" y="580" width="200" height="4" rx="2" fill="#FBF5EA" opacity="0.6"/>
</svg>